name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    # Pinned: the RNG fixtures and Python/Rust parity call glibc libm; 24.04 ships the same glibc (2.39)
    # the fixtures were generated with.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - run: cargo fmt --all --check
      - run: cargo clippy --release --workspace --all-targets -- -D warnings
      - run: cargo test --release --workspace
      - run: cargo build --release --workspace
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r ../requirements.txt
      - name: Bit-exact parity, Python reference engine vs Rust core
        working-directory: .
        # NumPy ships its own AVX-512 kernels for exp/log/power and picks them at runtime on AVX-512 CPUs
        # (most CI runners). They can differ from glibc libm by 1 ulp, so the Python oracle's results depend
        # on the CPU. The Rust core always uses glibc. Disabling those kernels reproduces the reference
        # machine (AVX2, no AVX-512), where the oracle was frozen.
        env:
          NPY_DISABLE_CPU_FEATURES: "X86_V4 AVX512_ICL AVX512_SPR"
        run: |
          python3 -c "import numpy._core._multiarray_umath as m; print([k for k, v in m.__cpu_features__.items() if v])"
          python3 core/tools/parity_check.py                        # 3-port setup, 60 days
          python3 core/tools/parity_check.py F-B-R1-O3 1 200 50     # full classic map, 200 days
      - name: Python sources compile
        working-directory: .
        run: python3 -m compileall -q sim experiments core/tools showcase
